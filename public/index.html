<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>سند</title>
<style>
:root{--bg:#000;--s1:#0c0c0e;--s2:#1c1c1e;--line:#2c2c2e;--tx:#f5f5f7;--mu:#86868b;--g:#39ff14;--red:#ff453a}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,"SF Pro Arabic","SF Pro Text","Segoe UI",Tahoma,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.app{max-width:760px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:0 20px env(safe-area-inset-bottom)}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 16px) 0 8px}
.logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700}
.logo i{width:12px;height:12px;border-radius:50%;background:var(--g);box-shadow:0 0 14px var(--g)}
.bar{display:flex;gap:8px}
.pill{display:flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:99px;background:var(--s2);font-size:14px;color:var(--tx)}
.pill svg{width:16px;height:16px}.pill.on{color:var(--g)}.sos{color:var(--red)}
#loc{min-height:20px;font-size:13px;color:var(--mu);padding:4px 2px}
#loc.err{color:var(--red)}#loc.ok{color:var(--g)}
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;gap:28px;padding:20px 0 40px}
h1{font-size:clamp(34px,7vw,52px);line-height:1.25;font-weight:700;letter-spacing:-.5px;max-width:560px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:12px 18px;border-radius:99px;background:var(--s2);font-size:15px;transition:background .2s}
.chip:hover{background:#2c2c2e}
.started .hero{display:none}
#chat{flex:1;display:none;flex-direction:column;gap:12px;padding:14px 0;overflow-y:auto}
.started #chat{display:flex}
.msg{max-width:86%;padding:12px 16px;border-radius:20px;line-height:1.8;white-space:pre-wrap;font-size:16px}
.user{align-self:flex-start;background:var(--g);color:#000;border-end-start-radius:6px}
.bot{align-self:flex-end;background:var(--s2);border-end-end-radius:6px}
.spk{display:inline-flex;margin-top:8px;color:var(--mu);padding:4px}.spk:hover,.spk.on{color:var(--g)}.spk svg{width:18px;height:18px}
.svc{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px;padding:12px 14px;background:var(--s1);border:1px solid var(--line);border-radius:14px;white-space:normal}
.svc small{display:block;color:var(--mu)}.svc a{color:var(--g);text-decoration:none;font-size:14px;margin-inline-start:10px}
form{position:sticky;bottom:0;display:flex;align-items:center;gap:8px;margin:8px 0 16px;padding:8px;border-radius:99px;background:var(--s2);border:1px solid var(--line)}
form:focus-within{border-color:var(--g)}
#inp{flex:1;min-width:0;background:none;border:0;outline:0;padding:10px 14px;font-size:16px}
#inp::placeholder{color:var(--mu)}
.ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.ic svg{width:22px;height:22px}
#mic{background:var(--s1);color:var(--tx)}
#mic.on{background:var(--red);animation:pulse 1.2s infinite}
#send{background:var(--g);color:#000;box-shadow:0 0 18px #39ff1455}
@keyframes pulse{50%{box-shadow:0 0 0 10px #ff453a22}}
#toast{position:fixed;inset-inline:20px;bottom:96px;margin:auto;max-width:420px;padding:12px 16px;border-radius:14px;background:#2c2c2e;text-align:center;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.show{opacity:1}
dialog{margin:auto;width:min(92vw,420px);padding:24px;border:1px solid var(--line);border-radius:24px;background:var(--s1);color:var(--tx)}
dialog::backdrop{background:#000a;backdrop-filter:blur(8px)}
dialog h2{font-size:20px;margin-bottom:16px}
.nums{display:grid;gap:10px}
.num{display:flex;justify-content:space-between;align-items:center;padding:16px;border-radius:16px;background:var(--s2);color:var(--tx);text-decoration:none}
.num b{font-size:24px;color:var(--g);direction:ltr}
.note{margin-top:14px;font-size:13px;color:var(--mu);line-height:1.7}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="logo"><i></i>سند</div>
    <div class="bar">
      <button class="pill" id="locBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.800 12 21 12 21z"/><circle cx="12" cy="9.500" r="2.500"/></svg>موقعي</button>
      <button class="pill" id="ttsBtn" aria-pressed="false" title="قراءة الردود تلقائيًا"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.500 8.500a5 5 0 0 1 0 7M18.500 5.500a9 9 0 0 1 0 13"/></svg>قراءة</button>
      <button class="pill sos" id="sosBtn">طوارئ</button>
    </div>
  </header>
  <div id="loc"></div>

  <section class="hero">
    <h1 id="hi"></h1>
    <div class="chips">
      <button class="chip" data-q="أحتاج مساعدة طبية عاجلة">طوارئ طبية</button>
      <button class="chip" data-q="سيارتي معطلة على الطريق، أحتاج ميكانيكي أو سحب">عطل في السيارة</button>
      <button class="chip" data-q="أبحث عن أقرب مستشفى">أقرب مستشفى</button>
      <button class="chip" data-q="كيف أتصرف عند حدوث حريق؟">حريق</button>
      <button class="chip" data-q="ما خطوات الإسعاف الأولي للحروق؟">حروق</button>
    </div>
  </section>

  <div id="chat" aria-live="polite"></div>

  <form id="f" autocomplete="off">
    <button type="button" class="ic" id="mic" aria-label="تحدث بدل الكتابة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <input id="inp" placeholder="اكتب أو اضغط الميكروفون وتحدث" aria-label="رسالتك">
    <button class="ic" id="send" aria-label="إرسال"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.500" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </form>
</div>

<div id="toast"></div>
<dialog id="dlg">
  <h2>أرقام الطوارئ في الإمارات</h2>
  <div class="nums">
    <a class="num" href="tel:999">الشرطة <b>999</b></a>
    <a class="num" href="tel:998">الإسعاف <b>998</b></a>
    <a class="num" href="tel:997">الدفاع المدني <b>997</b></a>
  </div>
  <p class="note">في الحالات الخطرة اتصل مباشرة. سند مساعد إرشادي ولا يتصل بالجهات نيابة عنك.</p>
  <form method="dialog" style="all:unset"><button class="chip" style="margin-top:16px;width:100%">إغلاق</button></form>
</dialog>

<script>
const $ = s => document.querySelector(s);
const app = $('#app'), chat = $('#chat'), inp = $('#inp'), locEl = $('#loc');
let coords = null, autoRead = false;

// عبارة ترحيب عشوائية
const hi = ['أهلًا بك، بماذا أساعدك؟','سند معك. ما الذي تحتاجه؟','أخبرني ما الذي يحدث.','أنا هنا. من أين نبدأ؟','ما الأمر؟ أنا أسمعك.','في أي شيء تحتاج سندًا؟','قل لي ما تحتاجه الآن.','خذ نفسًا، ثم أخبرني.'];
$('#hi').textContent = hi[Math.floor(Math.random() * hi.length)];

function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 3500); }

// ---- قراءة النص ----
const ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.500 8.500a5 5 0 0 1 0 7"/></svg>';
function speak(text, btn) {
  if (!('speechSynthesis' in window)) return toast('المتصفح لا يدعم قراءة النص.');
  const was = btn && btn.classList.contains('on');
  speechSynthesis.cancel();
  document.querySelectorAll('.spk.on').forEach(b => b.classList.remove('on'));
  if (was) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ar-SA';
  const v = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().startsWith('ar'));
  if (v) u.voice = v;
  if (btn) { btn.classList.add('on'); u.onend = u.onerror = () => btn.classList.remove('on'); }
  speechSynthesis.speak(u);
}
$('#ttsBtn').onclick = e => {
  autoRead = !autoRead; e.currentTarget.classList.toggle('on', autoRead);
  e.currentTarget.setAttribute('aria-pressed', autoRead);
  if (!autoRead) speechSynthesis.cancel();
  toast(autoRead ? 'ستُقرأ الردود بصوت عالٍ.' : 'تم إيقاف القراءة التلقائية.');
};

// ---- المحادثة ----
function add(text, cls) { const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text; chat.appendChild(d); chat.scrollTop = chat.scrollHeight; window.scrollTo(0, document.body.scrollHeight); return d; }
function fillBot(el, reply, services = []) {
  el.textContent = reply;
  for (const s of services) {
    const d = document.createElement('div'); d.className = 'svc';
    const info = document.createElement('div'); info.textContent = s.name;
    const sm = document.createElement('small'); sm.textContent = s.distance; info.appendChild(sm);
    const acts = document.createElement('div');
    if (s.phone) { const a = document.createElement('a'); a.href = 'tel:' + s.phone.replace(/[^\d+]/g, ''); a.textContent = 'اتصال'; acts.appendChild(a); }
    const m = document.createElement('a'); m.target = '_blank'; m.rel = 'noopener'; m.textContent = 'الاتجاهات';
    m.href = `https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lon}`; acts.appendChild(m);
    d.append(info, acts); el.appendChild(d);
  }
  const b = document.createElement('button'); b.className = 'spk'; b.type = 'button'; b.setAttribute('aria-label', 'قراءة الرد'); b.innerHTML = ICON;
  b.onclick = () => speak(reply, b); el.appendChild(b);
  if (autoRead) speak(reply, b);
  chat.scrollTop = chat.scrollHeight;
}
async function send(text) {
  text = (text ?? inp.value).trim(); if (!text) return;
  inp.value = ''; app.classList.add('started'); add(text, 'user');
  if (!coords && /قريب|أقرب|مستشفى|عيادة|ميكانيك|ورشة|سحب|ونش/.test(text)) await locate();
  const el = add('…', 'bot');
  try {
    const r = await fetch('/api/assist', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: text, latitude: coords?.lat, longitude: coords?.lon }) });
    const d = await r.json();
    fillBot(el, d.reply || 'لم أحصل على رد.', d.services);
  } catch { fillBot(el, 'تعذّر الاتصال بالخادم. شغّل الخادم بالأمر npm start وافتح الموقع من http://localhost:3000. في الطوارئ اتصل بـ 999.'); }
}
$('#f').onsubmit = e => { e.preventDefault(); send(); };
document.querySelectorAll('.chip[data-q]').forEach(b => b.onclick = () => send(b.dataset.q));
$('#sosBtn').onclick = () => $('#dlg').showModal();

// ---- تحديد الموقع ----
function setLoc(cls, t) { locEl.className = cls; locEl.textContent = t; }
const getPos = o => new Promise((ok, no) => navigator.geolocation.getCurrentPosition(ok, no, o));
async function locate() {
  setLoc('', 'جارٍ تحديد موقعك…');
  let denied = false;
  if (!window.isSecureContext) {
    setLoc('err', 'المتصفح يمنع GPS هنا. افتح الموقع من http://localhost:3000 أو عبر HTTPS، وليس من ملف مباشر أو عنوان IP.');
  } else if (!navigator.geolocation) {
    setLoc('err', 'المتصفح لا يدعم تحديد الموقع.');
  } else {
    // محاولتان: دقة عالية ثم دقة عادية (أجهزة الكمبيوتر غالبًا بلا GPS فتنتهي الأولى بمهلة)
    for (const o of [{ enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }, { enableHighAccuracy: false, timeout: 15000, maximumAge: 300000 }]) {
      try {
        const p = await getPos(o);
        coords = { lat: +p.coords.latitude.toFixed(6), lon: +p.coords.longitude.toFixed(6) };
        setLoc('ok', `تم تحديد موقعك (دقة ${Math.round(p.coords.accuracy)} م)`); return coords;
      } catch (e) { if (e.code === 1) { denied = true; break; } }
    }
  }
  // احتياطي: موقع تقريبي من عنوان الشبكة
  try {
    const j = await (await fetch('https://ipwho.is/')).json();
    if (j.success) { coords = { lat: j.latitude, lon: j.longitude }; setLoc('ok', 'موقع تقريبي حسب الشبكة. فعّل GPS لنتائج أدق.'); return coords; }
  } catch {}
  setLoc('err', denied ? 'تم رفض إذن الموقع. اضغط أيقونة القفل بجانب العنوان، اسمح بالموقع، ثم أعد المحاولة.' : 'تعذّر تحديد الموقع. فعّل خدمة الموقع في جهازك ثم أعد المحاولة.');
  return null;
}
$('#locBtn').onclick = locate;

// ---- الإدخال الصوتي ----
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
$('#mic').onclick = () => {
  if (!SR) return toast('المتصفح لا يدعم الإدخال الصوتي. استخدم Chrome أو Safari.');
  if (!window.isSecureContext) return toast('الميكروفون يحتاج localhost أو HTTPS.');
  if (listening) return rec.stop();
  rec = new SR(); rec.lang = 'ar-AE'; rec.interimResults = true; rec.continuous = false;
  const base = inp.value.trim();
  rec.onstart = () => { listening = true; $('#mic').classList.add('on'); inp.placeholder = 'أنا أسمعك…'; };
  rec.onresult = e => { inp.value = (base + ' ' + [...e.results].map(r => r[0].transcript).join(' ')).trim(); };
  rec.onerror = e => toast(e.error === 'not-allowed' ? 'اسمح للمتصفح باستخدام الميكروفون.' : e.error === 'no-speech' ? 'لم أسمع شيئًا. حاول مرة أخرى.' : 'تعذّر الإدخال الصوتي (' + e.error + ').');
  rec.onend = () => { listening = false; $('#mic').classList.remove('on'); inp.placeholder = 'اكتب أو اضغط الميكروفون وتحدث'; inp.focus(); };
  try { rec.start(); } catch {}
};
</script>
</body>
</html>
