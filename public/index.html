<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>سند</title>
<link rel="icon" href="/logo.png">
<style>
:root{--bg:#000;--s1:#0c0c0e;--s2:#1c1c1e;--line:#2c2c2e;--tx:#f5f5f7;--mu:#86868b;--g:#39ff14;--red:#ff453a;--logo:var(--g);--warn:#ffb340}
:root[data-theme="light"]{--bg:#f6f5f1;--s1:#ffffff;--s2:#eeece5;--line:#ddd8cc;--tx:#1a1a1a;--mu:#6b6a63;--red:#d92d20;--logo:#1a1a1a;--warn:#b45309}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,"SF Pro Arabic","SF Pro Text","Segoe UI",Tahoma,sans-serif;-webkit-font-smoothing:antialiased;transition:background-color .35s ease,color .35s ease}
body,.pill,.chip,.msg,dialog,form.c,.svc,.num,.opt,.sw{transition:background-color .3s ease,color .3s ease,border-color .3s ease}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.app{max-width:760px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:0 20px env(safe-area-inset-bottom)}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 16px) 0 8px}
.logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700}
.logo-ico{width:36px;height:36px;flex:none;background:var(--logo);-webkit-mask:url(/logo.png) center/contain no-repeat;mask:url(/logo.png) center/contain no-repeat;transition:background-color .3s ease}
.bar{display:flex;gap:8px}
.pill{display:flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:99px;background:var(--s2);font-size:14px}
.pill svg{width:16px;height:16px}.pill.on{color:var(--g)}.sos{color:var(--red)}.sq{width:36px;padding:0;justify-content:center}
#loc{min-height:20px;font-size:13px;color:var(--mu);padding:4px 2px}
#loc.err{color:var(--red)}#loc.ok{color:var(--g)}#loc.warn{color:#ffd60a}
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;gap:26px;padding:20px 0 40px}
.mark{width:72px;height:72px;background:var(--logo);-webkit-mask:url(/logo.png) center/contain no-repeat;mask:url(/logo.png) center/contain no-repeat;transition:background-color .3s ease}
h1{font-size:clamp(34px,7vw,52px);line-height:1.25;font-weight:700;letter-spacing:-.5px;max-width:560px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:12px 18px;border-radius:99px;background:var(--s2);font-size:15px;transition:background .2s}
.chip:hover{background:#2c2c2e}
.started .hero{display:none}
#chat{flex:1;display:none;flex-direction:column;gap:12px;padding:14px 0;overflow-y:auto}
.started #chat{display:flex}
.msg{max-width:86%;padding:12px 16px;border-radius:20px;line-height:1.8;white-space:pre-wrap;font-size:16px;animation:msgIn .28s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.typing{display:inline-flex;gap:5px;padding:5px 3px}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--mu);animation:tdot 1.1s infinite ease-in-out}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
.user{align-self:flex-start;background:var(--g);color:#000;border-end-start-radius:6px}
.user .icbtn{color:#000;opacity:.55}
.user .icbtn:hover,.user .icbtn.on{opacity:1;color:#000;background:rgba(0,0,0,.12)}
.bot{align-self:flex-end;background:var(--s2);border-end-end-radius:6px}
.spk svg{width:18px;height:18px}
.actions{display:flex;align-items:center;gap:4px;margin-top:8px}
.icbtn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;color:var(--mu);flex:none}
.icbtn:hover,.icbtn.on{color:var(--g);background:color-mix(in srgb,var(--g) 12%,transparent)}
.icbtn svg{width:16px;height:16px}
.user-actions{justify-content:flex-end}
.steps{margin-top:10px;padding:14px 16px;background:var(--s1);border:1px solid var(--line);border-radius:16px}
.steps-label{font-size:12px;color:var(--mu);font-weight:700;letter-spacing:.3px}
.steps-body{margin:10px 0 14px;font-size:16px;line-height:1.8;min-height:44px}
.steps-body.anim{animation:stepIn .22s ease}
@keyframes stepIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.step-illus.anim svg{animation:illusIn .32s cubic-bezier(.22,1,.36,1)}
@keyframes illusIn{from{opacity:0;transform:scale(.82) translateY(4px)}to{opacity:1;transform:scale(1) translateY(0)}}
.steps-nav{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.stepbtn{width:38px;height:38px;border-radius:50%;background:var(--s2);color:var(--tx);flex:none}
.stepbtn svg{width:18px;height:18px}
.stepbtn.next{background:var(--g);color:#000}
.stepbtn.next.done{background:var(--s2);color:var(--g)}
.stepbtn:disabled{opacity:.35;pointer-events:none}
/* اتجاه السهم يُحدَّد عبر CSS حسب dir الفعلي للصفحة، لا عبر شرط لغة بجافاسكربت، لضمان عدم انعكاسه أبدًا */
.stepbtn.prev svg{transform:scaleX(-1)}
html[dir="rtl"] .stepbtn.prev svg{transform:scaleX(1)}
html[dir="rtl"] .stepbtn.next svg{transform:scaleX(-1)}
.step-illus{position:relative;display:flex;justify-content:center;align-items:center;color:var(--g);min-height:78px;margin-bottom:6px}
.step-illus::before{content:'';position:absolute;width:104px;height:78px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--g) 16%,transparent),transparent 72%);animation:illusGlow 3.6s ease-in-out infinite}
@keyframes illusGlow{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1.04)}}
.step-illus svg{position:relative;width:128px;height:92px}
.step-illus .fa-float{animation:faFloat 3.4s ease-in-out infinite}
@keyframes faFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.disc{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;margin-bottom:4px;border-radius:14px;background:color-mix(in srgb,var(--g) 7%,var(--s1));border:1px solid color-mix(in srgb,var(--g) 22%,var(--line));animation:msgIn .3s ease}
.disc p{flex:1;margin:0;font-size:12.5px;line-height:1.7;color:var(--mu);font-style:italic}
.disc-x{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--mu)}
.disc-x:hover{color:var(--tx);background:var(--s2)}
.disc-x svg{width:12px;height:12px}
.caret{display:inline-block;width:2px;height:1em;background:var(--g);margin-inline-start:2px;vertical-align:-3px;animation:caretBlink .85s steps(1) infinite}
@keyframes caretBlink{50%{opacity:0}}
.svc{display:flex;flex-direction:column;gap:10px;margin-top:10px;padding:14px 16px;background:var(--s1);border:1px solid var(--line);border-radius:14px;white-space:normal;opacity:0;animation:msgIn .32s ease forwards;animation-delay:calc(var(--i,0) * .09s)}
.svc.rec{border-color:var(--g)}
.svc small{display:block;color:var(--mu);margin-top:2px}
.svc-badge{display:inline-block;margin-inline-start:8px;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--g) 18%,transparent);color:var(--g);font-size:11px;font-weight:700;vertical-align:middle}
.svc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.svc-meta{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.svc-rating{display:flex;align-items:center;gap:3px;color:var(--g);font-size:12.5px;font-weight:700;white-space:nowrap}
.svc-rating svg{width:12px;height:12px}
.svc-hours{color:var(--mu);font-size:11px;white-space:nowrap}
.svc-actions{display:flex;flex-wrap:wrap;gap:8px}
.svc-btn{flex:1 1 92px;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 12px;border-radius:12px;font-size:13.5px;font-weight:700;text-decoration:none;border:1px solid var(--line);color:var(--tx);transition:opacity .2s ease,transform .05s ease}
.svc-btn:active{transform:scale(.97)}
.svc-btn svg{width:15px;height:15px;flex:none}
.svc-btn.dir{background:var(--s2);color:var(--g);border-color:var(--g)}
.svc-btn.call{background:var(--g);color:#04140a;border-color:var(--g)}
.svc-btn.web{background:transparent;color:var(--tx);border-color:var(--line)}
.svc-btn.web:hover{border-color:var(--g);color:var(--g)}
.svc.other{border-style:dashed}
.svc.other .svc-btn.call{background:var(--s2);color:var(--tx);border-color:var(--line)}
.svc-tag{display:flex;align-items:center;gap:5px;width:fit-content;max-width:100%;margin-top:7px;padding:3px 10px 3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent);border:1px solid color-mix(in srgb,var(--warn) 32%,transparent)}
.svc-tag svg{width:12px;height:12px;flex:none}
.svc-sep{display:flex;align-items:center;gap:10px;margin-top:16px;color:var(--mu);font-size:12px;font-weight:600;white-space:normal}
.svc-sep::before,.svc-sep::after{content:"";flex:1;height:1px;background:var(--line)}
form.c{position:sticky;bottom:0;display:flex;align-items:center;gap:8px;margin:8px 0 16px;padding:8px;border-radius:99px;background:var(--s2);border:1px solid var(--line)}
form.c:focus-within{border-color:var(--g)}
#inp{flex:1;min-width:0;background:none;border:0;outline:0;padding:10px 14px;font-size:16px}
#inp::placeholder{color:var(--mu)}
.ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.ic svg{width:22px;height:22px}
#mic{background:var(--s1)}#mic:disabled{opacity:.5}
#quickBtn{background:var(--s1)}
.qopt{display:block;width:100%;text-align:start;padding:14px 16px;border-radius:14px;background:var(--s2);margin-bottom:8px;font-size:15px;transition:background .2s}
.qopt:hover{background:color-mix(in srgb,var(--g) 15%,var(--s2))}
#quickList{max-height:50vh;overflow-y:auto;margin:14px 0}
.vidwrap{margin-top:10px;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.vidwrap video{width:100%;display:block;background:#000;max-height:320px}
.vidcap{display:flex;align-items:center;justify-content:center;gap:7px;font-size:12.5px;color:var(--mu);padding:9px 12px;background:linear-gradient(0deg,var(--s1),color-mix(in srgb,var(--g) 5%,var(--s1)));border-top:1px dashed var(--line);font-style:italic}
.vidcap svg{width:14px;height:14px;flex:none;opacity:.75;color:var(--g)}
#mic.on{background:var(--red);animation:pulse 1.2s infinite}
#send{background:var(--g);color:#000;box-shadow:0 0 18px color-mix(in srgb,var(--g) 35%,transparent)}
@keyframes pulse{50%{box-shadow:0 0 0 10px #ff453a22}}
#toast{position:fixed;inset-inline:20px;bottom:96px;margin:auto;max-width:420px;padding:12px 16px;border-radius:14px;background:#2c2c2e;text-align:center;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9}
#toast.show{opacity:1}
dialog{margin:auto;width:min(92vw,420px);padding:24px;border:1px solid var(--line);border-radius:24px;background:var(--s1);color:var(--tx)}
dialog::backdrop{background:#000a;backdrop-filter:blur(8px)}
dialog h2{font-size:20px;margin-bottom:16px}
dialog h3{font-size:14px;color:var(--mu);font-weight:500;margin:18px 0 8px}
.nums{display:grid;gap:10px}
.num{display:flex;justify-content:space-between;align-items:center;padding:16px;border-radius:16px;background:var(--s2);color:var(--tx);text-decoration:none}
.num b{font-size:24px;color:var(--g);direction:ltr}
.note{margin-top:14px;font-size:13px;color:var(--mu);line-height:1.7}
.row{display:flex;gap:8px;flex-wrap:wrap}
.opt{padding:10px 18px;border-radius:99px;background:var(--s2);border:1px solid transparent}
.opt[aria-pressed=true]{border-color:var(--g);color:var(--g)}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid transparent}
.sw[aria-pressed=true]{border-color:#fff;box-shadow:0 0 0 2px #000 inset}
.fld{display:flex;gap:8px}.fld input{flex:1;min-width:0;background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:12px;outline:0}
.fld input:focus{border-color:var(--g)}
.go{background:var(--g);color:#000;font-weight:700;border-radius:14px;padding:0 16px}
.full{width:100%;margin-top:6px}
.lnk{display:none;margin-top:12px;color:var(--g);font-size:14px}
.cls{width:100%;margin-top:20px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="logo"><span class="logo-ico" aria-hidden="true"></span><span data-i="name"></span></div>
    <div class="bar">
      <button class="pill" id="locBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 21s7-6.200 7-11.500A7 7 0 0 0 5 9.500C5 14.800 12 21 12 21z"/><circle cx="12" cy="9.500" r="2.500"/></svg><span data-i="loc"></span></button>
      <button class="pill sq" id="setBtn" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
      <button class="pill sos" id="sosBtn" data-i="sos"></button>
    </div>
  </header>
  <div id="loc"></div>

  <section class="hero">
    <span class="mark" aria-hidden="true"></span>
    <h1 id="hi"></h1>
    <div class="chips" id="chips"></div>
  </section>

  <div id="chat" aria-live="polite"></div>

  <form class="c" id="f" autocomplete="off">
    <button type="button" class="ic" id="quickBtn" aria-label="Quick guides"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg></button>
    <button type="button" class="ic" id="mic" aria-label="Mic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <input id="inp" aria-label="Message">
    <button class="ic" id="send" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.500" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </form>
</div>

<div id="toast"></div>

<dialog id="dlg">
  <h2 data-i="sosT"></h2>
  <div class="nums">
    <a class="num" href="tel:999"><span data-i="police"></span><b>999</b></a>
    <a class="num" href="tel:998"><span data-i="amb"></span><b>998</b></a>
    <a class="num" href="tel:997"><span data-i="civil"></span><b>997</b></a>
  </div>
  <p class="note" data-i="sosN"></p>
  <form method="dialog"><button class="chip cls" data-i="close"></button></form>
</dialog>

<dialog id="locDlg">
  <h2 data-i="locT"></h2>
  <button class="go pill full" id="auto" style="height:44px;justify-content:center" data-i="auto"></button>
  <h3 data-i="manual"></h3>
  <div class="fld"><input id="geoQ" data-p="geoPh"><button class="go" id="geoGo" data-i="search"></button></div>
  <a class="lnk" id="verify" target="_blank" rel="noopener" data-i="verify"></a>
  <p class="note" data-i="locNote"></p>
  <form method="dialog"><button class="chip cls" data-i="close"></button></form>
</dialog>

<dialog id="setDlg">
  <h2 data-i="setT"></h2>
  <h3 data-i="themeL"></h3>
  <div class="row"><button class="opt" data-th="light" data-i="light"></button><button class="opt" data-th="dark" data-i="dark"></button></div>
  <h3 data-i="langL"></h3>
  <div class="row"><button class="opt" data-l="ar">العربية</button><button class="opt" data-l="en">English</button></div>
  <h3 data-i="colorL"></h3>
  <div class="row" id="sws"></div>
  <h3 data-i="readL"></h3>
  <div class="row"><button class="opt" id="readOpt" aria-pressed="false"></button></div>
  <form method="dialog"><button class="chip cls" data-i="close"></button></form>
</dialog>

<dialog id="quickDlg">
  <h2 data-i="quickT"></h2>
  <div id="quickList"></div>
  <form method="dialog"><button class="chip cls" data-i="close"></button></form>
</dialog>

<script>
const $ = s => document.querySelector(s);
const app = $('#app'), chat = $('#chat'), inp = $('#inp'), locEl = $('#loc');
const COLORS = ['#39ff14', '#00e5ff', '#ffd60a', '#ff9f0a', '#ff6bd6', '#e8d3b0'];

const T = {
  ar: {
    name:'سند', loc:'موقعي', sos:'طوارئ', ph:'اكتب أو اضغط الميكروفون وتحدث', listening:'أنا أسمعك… اضغط للإيقاف', trans:'جارٍ تحويل الصوت إلى نص…',
    greet:['أهلًا بك، بماذا أساعدك؟','سند معك. ما الذي تحتاجه؟','أخبرني ما الذي يحدث.','أنا هنا. من أين نبدأ؟','ما الأمر؟ أنا أسمعك.','في أي شيء تحتاج سندًا؟','قل لي ما تحتاجه الآن.','خذ نفسًا، ثم أخبرني.'],
    chips:[['طوارئ طبية','أحتاج مساعدة طبية عاجلة'],['عطل في السيارة','سيارتي معطلة على الطريق، أحتاج ميكانيكي أو سحب'],['أقرب مستشفى','أبحث عن أقرب مستشفى'],['حريق','كيف أتصرف عند حدوث حريق؟'],['حروق','ما خطوات الإسعاف الأولي للحروق؟']],
    sosT:'أرقام الطوارئ في الإمارات', police:'الشرطة', amb:'الإسعاف', civil:'الدفاع المدني', sosN:'في الحالات الخطرة اتصل مباشرة. سند مساعد إرشادي ولا يتصل بالجهات نيابة عنك.', close:'إغلاق',
    locT:'موقعك', auto:'تحديد تلقائي', manual:'أو اكتب منطقتك يدويًا', geoPh:'مثال: مدينة خليفة، أبوظبي', search:'بحث', verify:'تحقق من موقعك على الخريطة',
    locNote:'قد يخطئ تحديد الموقع أحيانًا، خصوصًا بالمناطق الجديدة أو ضعيفة التغطية. تحقق من موقعك على الخريطة قبل الاعتماد عليه بالكامل.',
    setT:'الإعدادات', themeL:'المظهر', light:'صباحي', dark:'مسائي', langL:'اللغة', colorL:'اللون', readL:'قراءة الردود بصوت عالٍ', on:'مفعّلة', off:'متوقفة',
    locating:'جارٍ تحديد موقعك…', insecure:'المتصفح يمنع GPS هنا. افتح الموقع عبر HTTPS.', nogeo:'المتصفح لا يدعم تحديد الموقع.',
    ok:'تم تحديد موقعك (دقة {n} م)', lowacc:'الدقة منخفضة (نحو {n} كم). للنتائج الأدق اكتب منطقتك يدويًا.', approx:'موقع تقريبي حسب الشبكة وقد يكون بعيدًا. اكتب منطقتك يدويًا من زر «موقعي».',
    denied:'تم رفض إذن الموقع. اضغط أيقونة القفل بجانب العنوان واسمح بالموقع، أو اكتب منطقتك يدويًا.', failed:'تعذّر تحديد الموقع. اكتب منطقتك يدويًا من زر «موقعي».', notfound:'لم أجد هذا المكان. جرّب اسمًا آخر.', manualOk:'الموقع: ',

let cfg = { lang: 'ar', color: COLORS[0], read: false, theme: 'dark' }, gi = Math.floor(Math.random() * 8), coords = null, history = [];
function pushHistory(role, text) { if (!text) return; history.push({ role, text }); if (history.length > 20) history = history.slice(-20); }
try { Object.assign(cfg, JSON.parse(localStorage.getItem('sanad') || '{}')); } catch {}
const save = () => { try { localStorage.setItem('sanad', JSON.stringify(cfg)); } catch {} };
const t = k => T[cfg.lang][k];

function applyCfg() {
  document.documentElement.lang = cfg.lang; document.documentElement.dir = cfg.lang === 'ar' ? 'rtl' : 'ltr';
  document.documentElement.style.setProperty('--g', cfg.color);
  if (cfg.theme === 'light') document.documentElement.setAttribute('data-theme', 'light'); else document.documentElement.removeAttribute('data-theme');
  const mc = document.querySelector('meta[name=theme-color]'); if (mc) mc.setAttribute('content', cfg.theme === 'light' ? '#f6f5f1' : '#000000');
  document.querySelectorAll('[data-i]').forEach(e => e.textContent = t(e.dataset.i));
  document.querySelectorAll('[data-p]').forEach(e => e.placeholder = t(e.dataset.p));
  inp.placeholder = t('ph'); $('#hi').textContent = t('greet')[gi];
  $('#chips').replaceChildren(...t('chips').map(([l, q]) => { const b = document.createElement('button'); b.className = 'chip'; b.textContent = l; b.onclick = () => send(q); return b; }));
  document.querySelectorAll('[data-l]').forEach(b => b.setAttribute('aria-pressed', b.dataset.l === cfg.lang));
  document.querySelectorAll('[data-th]').forEach(b => b.setAttribute('aria-pressed', b.dataset.th === (cfg.theme || 'dark')));
  document.querySelectorAll('.sw').forEach(b => b.setAttribute('aria-pressed', b.dataset.c === cfg.color));
  $('#readOpt').textContent = cfg.read ? t('on') : t('off'); $('#readOpt').setAttribute('aria-pressed', cfg.read);
}
$('#sws').replaceChildren(...COLORS.map(c => { const b = document.createElement('button'); b.className = 'sw'; b.dataset.c = c; b.style.background = c; b.setAttribute('aria-label', c); b.onclick = () => { playClick(); cfg.color = c; save(); applyCfg(); }; return b; }));
document.querySelectorAll('[data-l]').forEach(b => b.onclick = () => { playClick(); cfg.lang = b.dataset.l; save(); applyCfg(); });
document.querySelectorAll('[data-th]').forEach(b => b.onclick = () => { playClick(); cfg.theme = b.dataset.th; save(); applyCfg(); });
$('#readOpt').onclick = () => { playClick(); cfg.read = !cfg.read; if (!cfg.read) speechSynthesis.cancel(); save(); applyCfg(); };
$('#setBtn').onclick = () => { playClick(); $('#setDlg').showModal(); };
$('#sosBtn').onclick = () => { playClick(); $('#dlg').showModal(); };
$('#locBtn').onclick = () => { playClick(); $('#locDlg').showModal(); };

  { id: 'nosebleed', test: /نزيف.*(أنف|الانف)|رعاف|nosebleed|nose\s*bleed/i,

    video: { ar: 'videos/nosebleed_ar.mp4', en: null },
    steps: { ar: '1. اجلس وانحنِ للأمام قليلًا، ولا تُميل رأسك للخلف.\n2. اضغط بلطف على الجزء اللين من الأنف لمدة 10 دقائق متواصلة.\n3. تنفّس من فمك أثناء ذلك.\n4. إن لم يتوقف النزيف خلال 20 دقيقة أو كان غزيرًا، اتصل بالإسعاف 998.',

  { id: 'bleeding', test: /نزيف|ينزف|bleed/i,

  { id: 'respiratory', test: /ضيق تنفس|صعوبة تنفس|ربو|أزمة تنفسية|breath|asthma|respiratory/i,

    video: { ar: 'videos/respiratory_ar.mp4', en: null },
    steps: { ar: '1. اطلب من المصاب الجلوس بوضعية مستقيمة تسهّل التنفس.\n2. اطمئنه وحاول تهدئته لتقليل الذعر.\n3. إن كان يحمل بخاخًا (كالربو) ساعده على استخدامه.\n4. اتصل بالإسعاف 998 فورًا إذا اشتدت الصعوبة أو تغيّر لون الشفاه.',

  { id: 'child_choking', test: /طفل.*(اختناق|مختنق|غصة|غصه|شرقة)|(اختناق|مختنق|غصة|غصه|شرقة).*طفل|رضيع.*(اختناق|مختنق|غصة|غصه)|infant choking|baby choking|child choking/i,
    title: { ar: 'اختناق الطفل', en: 'Choking child' },
    video: { ar: 'videos/child_choking_ar.mp4', en: null },
    steps: { ar: '1. اسأل الطفل إن استطاع: هل يمكنك السعال أو الكلام؟ إن استطاع، شجّعه على السعال بقوة.\n2. إن لم يستطع التنفس، أمِله للأمام وأسند صدره واضرب بين لوحي كتفيه 5 ضربات بكعب يدك.\n3. إن لم ينفع، أعطِ 5 ضغطات صدرية سريعة (وليس بطنية كالبالغين) في منتصف الصدر.\n4. مع الرضّع استخدم القوة نفسها لكن أخف بكثير، والطفل مستلقٍ على ساعدك ووجهه للأسفل أثناء الضربات.\n5. كرر حتى يخرج الجسم الغريب أو يفقد الوعي؛ اتصل بالإسعاف 998 فورًا في الحالتين.',
           en: '1. If the child can, ask them to cough or speak; if so, encourage forceful coughing.\n2. If they can\'t breathe, lean them forward, support their chest and give 5 back blows between the shoulder blades.\n3. If that fails, give 5 quick chest thrusts (not abdominal, unlike adults) in the middle of the chest.\n4. For infants use the same idea but much gentler force, with the baby face-down along your forearm during back blows.\n5. Repeat until the object clears or they lose consciousness; call ambulance 998 immediately either way.' } },
  { id: 'choking', test: /اختناق|مختنق|غصة|غصه|شرقة|choking|choke/i,
    title: { ar: 'الاختناق والغصة', en: 'Choking' },
    video: { ar: 'videos/choking_ar.mp4', en: ['videos/choking_en.mp4', 'videos/choking_en_2.mp4'] },
    steps: { ar: '1. اسأله: هل تستطيع السعال أو الكلام؟ إن استطاع، شجّعه على السعال بقوة.\n2. إن لم يستطع التنفس أو الكلام، أمِله للأمام واضرب بين لوحي كتفيه 5 ضربات بكعب يدك.\n3. إن لم ينفع، طبّق مناورة هايمليك: قف خلفه واضغط بقبضتك تحت القفص الصدري للأعلى وللداخل 5 مرات.\n4. كرر حتى يخرج الجسم الغريب أو يصل الإسعاف 998. مع الرضّع استخدم ضربات ظهر وضغطات صدر خفيفة بدل هايمليك.',
           en: '1. Ask: can you cough or speak? If yes, encourage forceful coughing.\n2. If they can\'t breathe or speak, lean them forward and give 5 back blows between the shoulder blades with your palm.\n3. If that fails, do the Heimlich maneuver: stand behind them and give 5 upward abdominal thrusts.\n4. Repeat until the object clears or ambulance 998 arrives. For infants, use gentle back blows and chest thrusts instead of the Heimlich.' } },
  { id: 'heat', test: /إجهاد حراري|اجهاد حراري|ضربة شمس|هبوط حراري|heat exhaustion|heat stroke/i,

    video: { ar: ['videos/heat_ar.mp4', 'videos/heat_ar_2.mp4'], en: null },
    steps: { ar: '1. انقل المصاب فورًا إلى مكان ظليل أو مكيّف.\n2. اخلع الملابس الزائدة ورطّب جلده بماء بارد أو مروحة.\n3. اسقه ماءً أو محلول إماهة ببطء إن كان واعيًا.\n4. اتصل بالإسعاف 998 إذا فقد الوعي أو ارتفعت حرارته بشدة أو لم يتحسن خلال 30 دقيقة.',

  { id: 'bites', test: /لدغة|لدغ|عضة سامة|أفعى|عقرب|snake bite|scorpion|venom/i,

    steps: { ar: '1. أبعد المصاب عن مصدر الخطر بهدوء دون مطاردته.\n2. اجعله ثابتًا وقلل حركته قدر الإمكان لإبطاء انتشار السم.\n3. ثبّت الطرف المصاب أسفل مستوى القلب إن أمكن.\n4. لا تشق الجرح ولا تحاول امتصاص السم ولا تضع ثلجًا.\n5. اتصل بالإسعاف 998 فورًا واذهب للمستشفى بأسرع وقت.',

  { id: 'burns', test: /حرق|حروق|احتراق|burn|burns|scald/i,

    steps: { ar: '1. بعّد المصاب فورًا عن مصدر الحرارة أو النار.\n2. برّد الحرق بماء جارٍ فاتر (ليس مثلجًا) لمدة 10-20 دقيقة.\n3. انزع الخواتم أو الملابس الضيقة القريبة من الحرق قبل أن يتورم، دون شد الجلد الملتصق.\n4. لا تضع معجون أسنان أو زبدة أو ثلجًا مباشرًا على الحرق، وغطّه بضمادة نظيفة غير لاصقة.\n5. اتصل بالإسعاف 998 إذا كان الحرق كبيرًا أو عميقًا أو كهربائيًا أو كيميائيًا أو في الوجه واليدين والمفاصل.',

  { id: 'fire_equipment', test: /طفاي[ةه]|فوهة\s*(?:ال)?[إا]طفاء|خرطوم\s*(?:ال)?[إا]طفاء|extinguisher|fire\s*hose|hydrant/i,

    video: { ar: ['videos/extinguisher_ar.mp4', 'videos/fire_hose_ar.mp4'], en: null },
    steps: { ar: '1. اسحب مسمار الأمان من مقبض طفاية الحريق.\n2. وجّه الفوهة نحو قاعدة النار وليس نحو اللهب.\n3. اضغط على المقبض بثبات لإطلاق المادة.\n4. حرّك الفوهة يمينًا ويسارًا حتى تنطفئ النار تمامًا.\n5. عند استخدام خرطوم الإطفاء، افرده بالكامل قبل فتح الصمام واحتفظ بمخرج آمن خلفك دائمًا.\n6. إن لم تنطفئ النار خلال ثوانٍ قليلة، اترك المكان فورًا واتصل بالدفاع المدني 997.',

  { id: 'gas_fire', test: /دبة\s*(?:غاز|الغاز)|اسطوانة\s*(?:غاز|الغاز)|أسطوانة\s*(?:غاز|الغاز)|تسرب\s*غاز|gas\s*cylinder|gas\s*leak|gas\s*fire/i,
    title: { ar: 'حريق أو تسرب أسطوانة الغاز', en: 'Gas cylinder fire or leak' },
    video: { ar: 'videos/gas_cylinder_fire.mp4', en: 'videos/gas_cylinder_fire.mp4' },
    steps: { ar: '1. إذا كانت رائحة الغاز فقط دون اشتعال: لا تشغّل أي مفتاح كهرباء أو شعلة، أغلق صمام الأسطوانة إن أمكن بأمان، وهوّ المكان.\n2. أخلِ المكان فورًا وابتعد لمسافة آمنة.\n3. إذا اشتعلت الأسطوانة بالفعل، لا تحاول إطفاءها بنفسك ولا تحرّكها.\n4. أغلق الصمام فقط إذا كان ذلك ممكنًا دون أي خطر عليك.\n5. اتصل بالدفاع المدني 997 فورًا من مكان آمن.',

  { id: 'fire', test: /حريق|إخلاء|اخلاء|evacuat|fire/i,

    video: { ar: ['videos/fire_evac_ar.mp4', 'videos/building_evac_ar.mp4'], en: ['videos/fire_evac_en.mp4', 'videos/fire_rescue_en.mp4'] },

  { id: 'fracture', test: /كسر|fracture|broken bone/i,

    steps: { ar: '1. لا تحرك الطرف المصاب ولا تحاول تعديله.\n2. ثبّته بجبيرة مؤقتة (لوح خشب أو مجلة مطوية) واربطه برفق.\n3. ضع كمادة باردة ملفوفة بقماش لتقليل التورم.\n4. راقب علامات ضعف الدورة الدموية (زرقة أو تنميل) وخفف الرباط إن ظهرت.\n5. اتصل بالإسعاف 998 لنقله دون تحريك الطرف المكسور.',

  { id: 'wounds', test: /جرح|جروح|قطع عميق|wound|\bcut\b/i,

function detectScenario(text) { if (!text) return null; for (const sc of SCENARIOS) if (sc.test.test(text)) return sc; return null; }
// يدعم فيديو واحدًا أو أكثر لكل لغة (نص واحد أو مصفوفة نصوص) مع نفس منطق التبديل للغة الأخرى عند غيابه
function attachVideo(el, sc) {
  const other = cfg.lang === 'ar' ? 'en' : 'ar';
  const norm = v => Array.isArray(v) ? v.filter(Boolean) : (v ? [v] : []);
  let list = norm(sc.video[cfg.lang]);
  const usingOther = !list.length;
  if (usingOther) list = norm(sc.video[other]);
  if (!list.length) return;
  list.forEach(vid => {
    const wrap = document.createElement('div'); wrap.className = 'vidwrap';
    const v = document.createElement('video'); v.src = vid; v.controls = true; v.preload = 'metadata'; v.playsInline = true;
    wrap.appendChild(v);
    el.appendChild(wrap);
  });
  if (usingOther) {
    const cap = document.createElement('div'); cap.className = 'vidcap';
    cap.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 6 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-6-3.8-9s1.3-6.3 3.8-9z"/></svg><span></span>';
    cap.querySelector('span').textContent = cfg.lang === 'ar' ? 'الفيديو متاح بالإنجليزية فقط' : 'Video only available in Arabic';
    el.appendChild(cap);
  }
}
function renderQuickList() {
  $('#quickList').replaceChildren(...SCENARIOS.map(sc => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'qopt';
    b.textContent = sc.title[cfg.lang];
    b.onclick = () => { $('#quickDlg').close(); quickScenario(sc); };
    return b;
  }));
}
function quickScenario(sc) {
  app.classList.add('started'); insertDisclaimer();
  add(sc.title[cfg.lang], 'user'); playSend(); pushHistory('user', sc.title[cfg.lang]);
  const el = add('', 'bot');
  el.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
  setTimeout(async () => {
    const full = sc.steps[cfg.lang];
    const { intro, steps } = parseSteps(full);
    el.textContent = '';
    await typeText(el, intro);
    if (steps.length) el.appendChild(buildStepCard(steps));
    attachVideo(el, sc);
    addActions(el, full);
    pushHistory('model', full);
    chat.scrollTop = chat.scrollHeight; playReceive();
  }, 260);
}

// ---- أصوات خفيفة ----
let actx;
function beep(freq, dur, vol, type) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch {}
}
const playClick = () => beep(1100, .05, .025);
const playSend = () => beep(880, .09, .045);
const playReceive = () => beep(640, .14, .05);

function toast(m) { const el = $('#toast'); el.textContent = m; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 3500); }

// ---- نسخ نص برسالة ----
function copyText(text, btn) {
  const done = () => {
    btn.classList.add('on'); btn.innerHTML = CHECK_ICON; btn.setAttribute('aria-label', t('copied')); playClick();
    setTimeout(() => { btn.classList.remove('on'); btn.innerHTML = COPY_ICON; btn.setAttribute('aria-label', t('copy')); }, 1400);
  };
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand('copy'); } catch {}
    document.body.removeChild(ta); done();
  };
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(done).catch(fallback);
  else fallback();
}

// ---- عرض خطوات مرقّمة (إسعافات أولية وغيرها) خطوة بخطوة مع سهم تقدّم ----
function parseSteps(text) {
  const lines = text.split('\n');
  const re = /^\s*(\d+|[٠-٩]+)[.\)]\s*(.+)$/;
  let intro = [], steps = [], started = false;
  for (const line of lines) {
    const m = line.match(re);
    if (m) { started = true; steps.push(m[2].trim()); }
    else if (!started) intro.push(line);
    else if (line.trim() !== '') steps[steps.length - 1] += ' ' + line.trim();
  }
  return { intro: intro.join('\n').trim(), steps };
}

  }
  if (!coords && !namesPlace && needsPlace) await locate();
  const el = add('', 'bot');
  el.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
  try {
    const r = await fetch('/api/assist', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: text, latitude: coords?.lat, longitude: coords?.lon, lang: cfg.lang, history: history.slice(0, -1) }) });
    const d = await r.json();
    playReceive(); await fillBot(el, d.reply || '…', d.services, text);
    pushHistory('model', d.reply || '');
  } catch { await fillBot(el, t('down')); }
}
$('#f').onsubmit = e => { e.preventDefault(); send(); };

// ---- تحديد الموقع ----
function setLoc(cls, m) { locEl.className = cls; locEl.textContent = m; $('#locBtn').classList.toggle('on', cls === 'ok'); }
function got(lat, lon, acc, approx) {
  coords = { lat: +lat.toFixed(6), lon: +lon.toFixed(6) };
  const far = approx || acc > 3000;
  setLoc(approx ? 'warn' : far ? 'warn' : 'ok', approx ? t('approx') : far ? t('lowacc').replace('{n}', Math.round(acc / 1000)) : t('ok').replace('{n}', Math.round(acc)));
  const v = $('#verify'); v.href = `https://www.google.com/maps?q=${coords.lat},${coords.lon}`; v.style.display = 'inline-block';
  return coords;
}
// watchPosition ينتظر قراءة أدق حتى 12 ثانية ثم يقبل أفضل ما وصل
const gps = () => new Promise((ok, no) => {
  let best = null, last = null;
  const fin = () => { navigator.geolocation.clearWatch(id); clearTimeout(tm); best ? ok(best) : no(last || { code: 3 }); };
  const id = navigator.geolocation.watchPosition(p => { if (!best || p.coords.accuracy < best.coords.accuracy) best = p; if (p.coords.accuracy <= 100) fin(); }, e => { last = e; if (e.code === 1) fin(); }, { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 });
  const tm = setTimeout(fin, 12000);
});
const once = o => new Promise((ok, no) => navigator.geolocation.getCurrentPosition(ok, no, o));
async function locate() {
  setLoc('', t('locating')); let denied = false;
  if (!window.isSecureContext) setLoc('err', t('insecure'));
  else if (!navigator.geolocation) setLoc('err', t('nogeo'));
  else {
    try { const p = await gps(); return got(p.coords.latitude, p.coords.longitude, p.coords.accuracy); } catch (e) { denied = e.code === 1; }
    if (!denied) try { const p = await once({ enableHighAccuracy: false, timeout: 10000, maximumAge: 600000 }); return got(p.coords.latitude, p.coords.longitude, p.coords.accuracy); } catch (e) { denied = e.code === 1; }
  }
  try { const j = await (await fetch('https://ipwho.is/')).json(); if (j.success) return got(j.latitude, j.longitude, null, true); } catch {}
  setLoc('err', denied ? t('denied') : t('failed')); return null;
}
$('#auto').onclick = async () => { $('#locDlg').close(); await locate(); };
// يولّد بدائل إملائية شائعة لاسم المكان (تاء مربوطة/هاء، ألف بأشكالها، ياء/ألف مقصورة، تشكيل)
// حتى تنجح "الوثبه" كما تنجح "الوثبة" دون الحاجة لكتابة الاسم بشكل دقيق
function arabicSpellingVariants(place) {
  const strip = s => s.replace(/[\u064B-\u0652]/g, ''); // إزالة التشكيل
  const base = strip(place.trim());
  const swapEnd = (s, from, to) => s.replace(new RegExp(from + '(?=\\s|$)', 'g'), to);
  const candidates = new Set([base]);
  const normalized = base.replace(/[إأآ]/g, 'ا').replace(/ى/g, 'ي');
  candidates.add(normalized);
  candidates.add(swapEnd(normalized, 'ه', 'ة'));
  candidates.add(swapEnd(normalized, 'ة', 'ه'));
  return [...candidates].filter(Boolean).slice(0, 4);
}
async function geocodeOnce(q) {
  try {
    const r = await (await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ae&accept-language=' + cfg.lang + '&q=' + encodeURIComponent(q))).json();
    return r[0] || null;
  } catch { return null; }
}
$('#geoGo').onclick = async () => {
  const q = $('#geoQ').value.trim(); if (!q) return;
  try {
    for (const candidate of arabicSpellingVariants(q)) {
      const hit = await geocodeOnce(candidate);
      if (hit) { got(+hit.lat, +hit.lon, 50); setLoc('ok', t('manualOk') + hit.display_name.slice(0, 70)); $('#locDlg').close(); return; }
    }
    toast(t('notfound'));
  } catch { toast(t('failed')); }
};
$('#geoQ').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $('#geoGo').click(); } };

// ---- الميكروفون: تسجيل ثم تحويل إلى نص عبر الخادم (لا يعتمد على خدمة المتصفح) ----
async function toWav(blob) {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const buf = await ctx.decodeAudioData(await blob.arrayBuffer()); ctx.close();
  const rate = 16000, n = Math.max(1, Math.round(buf.duration * rate));
  const off = new OfflineAudioContext(1, n, rate), s = off.createBufferSource();
  s.buffer = buf; s.connect(off.destination); s.start();
  const pcm = (await off.startRendering()).getChannelData(0);
  const v = new DataView(new ArrayBuffer(44 + n * 2)), w = (o, str) => [...str].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) { const x = Math.max(-1, Math.min(1, pcm[i])); v.setInt16(44 + i * 2, x < 0 ? x * 0x8000 : x * 0x7fff, true); }
  const u = new Uint8Array(v.buffer); let bin = '';
  for (let i = 0; i < u.length; i += 0x8000) bin += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
  return btoa(bin);
}
let mr = null, chunks = [], stream = null, tmo;
$('#mic').onclick = async () => {
  if (mr && mr.state === 'recording') return mr.stop();
  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) return toast(t('nomic'));
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch { return toast(t('micDenied')); }
  chunks = []; mr = new MediaRecorder(stream);
  mr.ondataavailable = e => e.data.size && chunks.push(e.data);
  mr.onstop = async () => {
    clearTimeout(tmo); stream.getTracks().forEach(x => x.stop()); $('#mic').classList.remove('on');
    if (!chunks.length) { inp.placeholder = t('ph'); return; }
    inp.placeholder = t('trans'); $('#mic').disabled = true;
    try {
      const audio = await toWav(new Blob(chunks, { type: mr.mimeType }));
      const d = await (await fetch('/api/transcribe', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ audio, lang: cfg.lang }) })).json();
      d.text ? inp.value = (inp.value + ' ' + d.text).trim() : toast(t('nospeech'));
    } catch { toast(t('micFail')); }
    $('#mic').disabled = false; inp.placeholder = t('ph'); inp.focus();
  };
  mr.start(); $('#mic').classList.add('on'); inp.placeholder = t('listening');
  tmo = setTimeout(() => mr.state === 'recording' && mr.stop(), 30000);
};
